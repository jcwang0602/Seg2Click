[project]
name = "seg2click"
version = "0.1.0"
description = "Seg2Click: GUI grounding by query-conditioned click-mask segmentation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
# Install a CUDA build of torch/torchvision matching your driver first.
dependencies = [
    "transformers==5.16.1",
    "peft==0.20.0",
    "accelerate==1.14.0",
    "datasets>=3.0",
    "qwen-vl-utils==0.0.14",
    "scipy",
    "numpy",
    "Pillow",
    "safetensors",
    "PyYAML",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
# Fast Qwen3.5 linear-attention kernels (compiled against your torch/CUDA).
qwen35-kernels = ["flash-linear-attention==0.5.2", "causal-conv1d==1.7.0"]
# Qwen2-VL / Qwen2.5-VL / Qwen3-VL training uses FlashAttention-2.
flash-attn = ["flash-attn>=2.7"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seg2click*"]

[tool.ruff]
target-version = 'py38'
line-length = 120  # Must agree with Black

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "D",  # pydocstyle
    "E",  # Error
    "F",  # pyflakes
    "I",  # isort
    "ISC", # flake8-implicit-str-concat
    "N",  # pep8-naming
    "PGH",  # pygrep-hooks
    # "PTH", # flake8-use-pathlib
    "Q",  # flake8-quotes
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "W",  # Warning
    "YTT", # flake8-2020
]

exclude = [
    "migrations",
    "__pycache__",
    "manage.py",
    "settings.py",
    "env",
    ".env",
    "venv",
    ".venv",
]

ignore = [
    "B905",  # zip strict=True; remove once python <3.10 support is dropped.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D401",
    "E402",
    "E501",
    "TRY003",  # Avoid specifying messages outside exception class; overly strict, especially for ValueError
    "N812",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "chr",
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pep8-naming]
staticmethod-decorators = [
    "pydantic.validator",
    "pydantic.root_validator",
]
